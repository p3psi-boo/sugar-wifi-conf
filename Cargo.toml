[package]
name = "sugar-wifi-conf-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
description = "Rust BLE WiFi configuration service compatible with PiSugar clients"
license = "GPL-3.0-or-later"
repository = "https://github.com/PiSugar/sugar-wifi-conf"

[features]
default = ["ble"]
ble = ["dep:zbus"]

[dependencies]
anyhow = "1"
clap = { version = "4", default-features = false, features = ["color", "derive", "error-context", "help", "std", "suggestions", "usage"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["ansi", "env-filter", "fmt"] }
zbus = { version = "4", default-features = false, features = ["tokio"], optional = true }
libc = "0.2"

[profile.release]
lto = true
codegen-units = 1
strip = true
